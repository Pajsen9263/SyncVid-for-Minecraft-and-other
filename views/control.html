<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- i18next back-end loader -->
  <script src="https://unpkg.com/i18next@latest/i18next.min.js"></script>
  <script src="https://unpkg.com/i18next-http-backend@latest/i18nextHttpBackend.min.js"></script>
  <script src="https://unpkg.com/jquery-i18next@latest/jquery-i18next.min.js"></script>
  <!-- Initialization code for i18n -->
  <script src="/js/main-i18n.js"></script>
  <link rel="stylesheet" href="/css/control.css">

</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="#" data-i18n="title">Video Sync Control</a>
      <button id="btnAddDisplay" class="btn btn-outline-light me-2" data-i18n="AddDisplay">Ajouter Display</button>
      <button id="btnUpload" class="btn btn-outline-light" data-i18n="videoUpload">Uploader Vidéo</button>
      <select class="form-select w-auto" id="languageSwitcher">
        <option value="en">English</option>
        <option value="fr" selected>Français</option>
      </select>
      <input type="file" id="fileInput" accept="video/webm" class="d-none">
    </div>
  </nav>
  <div class="container">
    <div class="row">

      <div class="col-md-8">
        <div id="canvasContainer">
          <video id="masterVideo" class="video-js vjs-default-skin" controls playsinline preload="auto"></video>
        </div>
      </div>
      <div class="col-md-4">
        <h5 data-i18n="listvideo">Video List</h5>
        <ul id="videoList" class="list-group mb-4"></ul>

        <h5 data-i18n="displaylist">Display List</h5>
        <ul id="displayList" class="list-group"></ul>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="/js/control.js"></script>
</body>
</html>
